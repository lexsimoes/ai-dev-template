# Quality CI: runs on every PR and on every push to main.
# The job names (quality, invariants, dependencies, e2e) are used as
# required checks in the main protection (M6). Do not rename them without updating it there.

name: CI

on:
  pull_request:
    # labeled/unlabeled: re-evaluates the guard when the owner applies the invariant-approved label.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]

# Minimum permission: the jobs only read the code.
permissions:
  contents: read

# A new push to the same PR cancels the previous run (saves minutes).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  invariants:
    name: invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # check who applied the invariant-approved label
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history to compare with the target branch
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Guard (folder untouched, nothing skipped, no test missing)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        # In PRs, runs the guard from the target branch: a PR cannot loosen its own guard.
        # If it does not exist there yet (initial setup), uses the PR's guard. Runs before any
        # PR code (npm ci) and only uses Node's built-in modules.
        run: |
          GUARD=scripts/guard-invariants.ts
          if [ "$EVENT_NAME" = "pull_request" ] && git show "origin/$BASE_REF:$GUARD" > "$RUNNER_TEMP/guard-invariants.ts" 2>/dev/null; then
            GUARD="$RUNNER_TEMP/guard-invariants.ts"
          fi
          node "$GUARD"
      - name: Review-fix guard (fix commits stay out of protected paths)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # AGENTS.md, "Handle the review": every "fix: address review findings" commit in the PR must pass
        # check-fix (no protected path, under the cap, no test weakened). A subject that only starts with it
        # (e.g. a first paragraph of several lines, which %s joins) is selected too, and check-fix refuses it. The checker comes from the target
        # branch, like the guard above; the PR's own copy is used only if the target has none yet. It runs
        # before npm ci and only uses Node's built-in modules.
        run: |
          DIR="$RUNNER_TEMP/review-triage"
          mkdir -p "$DIR"
          TRIAGE=scripts/review/triage.ts
          if git show "origin/$BASE_REF:scripts/review/triage.ts" > "$DIR/triage.ts" 2>/dev/null \
            && git show "origin/$BASE_REF:scripts/review/lib.ts" > "$DIR/lib.ts" 2>/dev/null; then
            TRIAGE="$DIR/triage.ts"
          fi
          FIXES=$(git log --format='%H%x09%s' "origin/$BASE_REF..$HEAD_SHA" | awk -F'\t' 'index($2, "fix: address review findings") == 1 { print $1 }')
          if [ -z "$FIXES" ]; then
            echo "No \"fix: address review findings\" commit in this PR."
            exit 0
          fi
          STATUS=0
          for SHA in $FIXES; do
            node "$TRIAGE" check-fix --commit "$SHA" || STATUS=1
          done
          exit $STATUS
      # Only after the guard: npm ci runs scripts from the PR's package.json (postinstall etc.),
      # which could tamper with git or the environment before the guard decides.
      - name: Install dependencies
        run: npm ci
      - name: Invariant tests
        # Called directly (no npm run) so that changing package.json does not skip the tests.
        run: node --test "tests/invariants/**/*.test.ts"

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      report: ${{ steps.report.outputs.uploaded }}
    permissions:
      contents: read
      pull-requests: read # check who applied the test-approved label
      issues: read # a quarantined test must point at an open issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # compare with the target branch
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Parser for the guard (TypeScript, pinned by the target branch's lockfile)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        # The guard reads specs as syntax trees. TypeScript comes from the target branch's lockfile (version and
        # integrity checked), installed in a folder of its own, before any PR code and without the PR's .npmrc.
        run: |
          REF=HEAD
          if [ "$EVENT_NAME" = "pull_request" ]; then REF="origin/$BASE_REF"; fi
          DIR="$RUNNER_TEMP/guard-modules"
          mkdir -p "$DIR"
          git show "$REF:package-lock.json" > "$RUNNER_TEMP/base-lock.json"
          read -r VERSION INTEGRITY < <(node -e '
            const ts = require(process.argv[1]).packages["node_modules/typescript"];
            if (!ts?.version || !ts?.integrity) { console.error("typescript is not in the target branch lockfile"); process.exit(1); }
            console.log(ts.version, ts.integrity);' "$RUNNER_TEMP/base-lock.json")
          cd "$DIR"
          npm install --no-audit --no-fund --ignore-scripts --save-exact "typescript@$VERSION"
          node -e '
            const got = require(process.argv[1]).packages["node_modules/typescript"]?.integrity;
            if (got !== process.argv[2]) { console.error(`typescript integrity ${got} differs from the lockfile ${process.argv[2]}`); process.exit(1); }' "$DIR/package-lock.json" "$INTEGRITY"
          echo "E2E_GUARD_MODULES=$DIR" >> "$GITHUB_ENV"
      - name: Guard (assertions kept, nothing skipped, isolation untouched)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        # Like the invariant guard: the version on the target branch runs, before any PR code (npm ci).
        # The healer may change selectors; changing what a test checks needs the owner's test-approved label.
        run: |
          GUARD=scripts/guard-e2e.ts
          if [ "$EVENT_NAME" = "pull_request" ] && git show "origin/$BASE_REF:$GUARD" > "$RUNNER_TEMP/guard-e2e.ts" 2>/dev/null; then
            GUARD="$RUNNER_TEMP/guard-e2e.ts"
          fi
          node "$GUARD"
      # --ignore-scripts and no `npm run`: a PR's package.json cannot run code after the guard (a postinstall that
      # rewrites the specs) or swap the test command (an "e2e" script that skips them).
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Browser (the Chromium pinned by @playwright/test)
        run: npx --no playwright install --with-deps chromium
      # --tsconfig: only the protected e2e/tsconfig.json applies, to the config too; the root tsconfig.json (its paths)
      # could otherwise redirect @playwright/test.
      # Isolated: the demo app runs with APP_ENV=e2e and the fake AI provider, no secret reaches this job,
      # and the browser can only reach the app (playwright.config.ts, e2e/fixtures.ts).
      # Quarantined tests (@quarantine) run in the e2e-quarantine check instead, which is not required.
      - name: End-to-end tests of the critical flows
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/e2e-report.json
        run: npx --no playwright test --config=playwright.config.ts --tsconfig=e2e/tsconfig.json --grep-invert @quarantine --reporter=list,html,json
      - name: Flaky tests (passed only on a retry)
        if: always() && hashFiles('test-results/e2e-report.json') != ''
        run: node scripts/e2e-flaky.ts test-results/e2e-report.json
      - name: Report (on failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Results for the flaky-test issues (main only)
        if: always() && github.event_name == 'push' && hashFiles('test-results/e2e-report.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: test-results/e2e-report.json
          retention-days: 7
      - name: Mark the report for e2e-flaky
        id: report
        if: always() && github.event_name == 'push' && hashFiles('test-results/e2e-report.json') != ''
        run: echo "uploaded=true" >> "$GITHUB_OUTPUT"

  # On main only: one issue per flaky test (or a comment on its open issue). It runs main's own code, never a PR's,
  # and is the only job that may write issues.
  e2e-flaky:
    name: e2e-flaky
    needs: e2e
    # Also after a red e2e (a test can be flaky in a failing run), but only when the run left a report.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.e2e.outputs.report == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: e2e-report
      - name: Open or update the flaky-test issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/e2e-flaky.ts e2e-report.json --issues

  # Tests in quarantine keep running, but outside the required checks. Not required: a red result here blocks nothing.
  e2e-quarantine:
    name: e2e-quarantine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Any test in quarantine?
        id: any
        run: |
          if grep -rqs --include='*.ts' --include='*.tsx' -e '@quarantine' e2e; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "No test in quarantine."; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.any.outputs.found == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        if: steps.any.outputs.found == 'true'
        run: npm ci --ignore-scripts
      - name: Browser (the Chromium pinned by @playwright/test)
        if: steps.any.outputs.found == 'true'
        run: npx --no playwright install --with-deps chromium
      - name: Quarantined tests
        if: steps.any.outputs.found == 'true'
        run: npx --no playwright test --config=playwright.config.ts --tsconfig=e2e/tsconfig.json --grep @quarantine

  dependencies:
    name: dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Looks only at the dependencies this PR adds or changes (the diff), not the whole project.
      # Public repository: GitHub's dependency review.
      - if: ${{ !github.event.repository.private }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      # Private repository: GitHub's dependency review needs Advanced Security, so npm audit compares the PR's lockfile
      # with the target branch's and fails only on a high or critical advisory the PR introduces.
      - name: Target branch (for the comparison and the checker)
        if: ${{ github.event.repository.private }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: base
          persist-credentials: false
      - if: ${{ github.event.repository.private }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: base/.nvmrc
      - name: npm audit of what the PR introduces (private repository)
        if: ${{ github.event.repository.private }}
        run: |
          # The checker comes from the target branch: a PR cannot loosen its own check.
          if [ -f base/scripts/dependency-audit.ts ]; then checker=base/scripts/dependency-audit.ts
          else checker=scripts/dependency-audit.ts; echo "::notice::The target branch has no dependency-audit.ts yet: using this PR's copy (first time only)."
          fi
          node "$checker" base .
