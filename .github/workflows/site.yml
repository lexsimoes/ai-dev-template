# Product website (template repository only, not copied into projects): publishes site/ to https://getadt.online
# (Hostinger) when a change to site/ reaches main, or on demand. Merging into main is the approval to publish.
# Uploads over FTP with TLS and never deletes anything on the server. Needs three secrets, set by the owner in their
# own terminal: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD (hPanel -> Files -> FTP Accounts). Optional repository
# variable FTP_REMOTE_DIR: the folder that serves the domain, relative to the FTP account (default: public_html).

name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  site:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Secrets present
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing. Set each one in your own terminal: gh secret set NAME"
            exit 1
          fi
      - name: Install lftp
        run: sudo apt-get update -q && sudo apt-get install -y -q lftp
      - name: Upload site/ (TLS required, nothing deleted)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR || 'public_html' }}
        run: |
          lftp -u "$FTP_USERNAME" --env-password "$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set net:max-retries 2
          set net:timeout 30
          mirror --reverse --verbose --exclude-glob *.md site/ "$REMOTE_DIR"
          bye
          EOF
      - name: Check the live pages
        run: |
          version=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')
          for url in https://getadt.online/ https://getadt.online/pt/; do
            body=$(curl -fsSL --retry 3 --retry-delay 5 "$url")
            echo "$body" | grep -q "releases/tag/v$version" || { echo "::error::$url does not show v$version yet"; exit 1; }
            echo "$url serves v$version"
          done
