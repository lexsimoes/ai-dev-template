# Independent review: an AI model different from the one that implemented reads the PR's diff
# with the criteria in REVIEW.md and comments the result on the PR.
# DeepSeek by default; Sonnet on sensitive paths; Opus with the "deep-review" label.
#
# Savings: drafts are ignored; the full review runs once, when the PR becomes ready.
# Later pushes do not call the model (they only keep or drop the previous verdict);
# to review again, only what changed, apply the "re-review" label.
# The job name (review) becomes a required check in M6.

name: Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

jobs:
  review:
    name: review
    # Only ready PRs (drafts cannot be merged; when it becomes ready, the PR is reviewed).
    # The other events (including unrelated labels) run without calling the model and recompute the verdict:
    # this check is required on main, and a skipped job would count as green.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No cancelling: a push right after "ready" must not throw away a review already paid for.
    # The queue keeps only one pending run; if it drops the "re-review" label's run,
    # the next run finds the label on the PR and runs the requested review. With "deep-review"
    # there is no such recovery (the label stays on the PR, and reacting to it on every push would be costly):
    # if the deep review does not show up in the comment, remove the label and apply it again.
    concurrency:
      group: review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write # post the report as a comment on the PR
    steps:
      - name: Fork PR
        # Forks do not get secrets: the reviewer does not run and the check turns red, never green by omission.
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::PR from a fork: the automated review does not run (no access to secrets). Review the diff by hand; to merge, bring the changes to a branch of this repository."
          exit 1
      - name: PR code (only to compute the diff)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Reviewer from the target branch (the PR does not change its own review)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          ref: ${{ github.base_ref }}
          persist-credentials: false
      - name: Choose the reviewer version
        id: source
        run: |
          if [ -f base/scripts/review/run.ts ]; then
            echo "dir=base" >> "$GITHUB_OUTPUT"
          else
            echo "dir=pr" >> "$GITHUB_OUTPUT"
            echo "::warning::The reviewer does not exist on the target branch yet; using this PR's version (initial setup)."
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ steps.source.outputs.dir }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ steps.source.outputs.dir }}/package-lock.json
      - name: Install the reviewer
        working-directory: ${{ steps.source.outputs.dir }}
        run: npm ci
      - name: Review
        working-directory: pr
        env:
          REVIEW_API_KEY: ${{ secrets.REVIEW_API_KEY }}
          REVIEW_DEEP_API_KEY: ${{ secrets.REVIEW_DEEP_API_KEY }}
          REVIEW_API_BASE_URL: ${{ vars.REVIEW_API_BASE_URL }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          REVIEW_SCRIPT: ${{ github.workspace }}/${{ steps.source.outputs.dir }}/scripts/review/run.ts
        run: node "$REVIEW_SCRIPT" --mode ci
