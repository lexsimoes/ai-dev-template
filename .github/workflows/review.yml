# Revisão independente: um modelo de IA diferente do que implementou lê o diff
# do PR com os critérios do REVIEW.md e comenta o resultado no PR.
# DeepSeek por padrão; Sonnet em caminhos sensíveis; Opus com o rótulo "revisão-profunda".
#
# Economia: rascunhos são ignorados; a revisão completa roda uma vez, quando o PR fica pronto.
# Pushes seguintes não chamam o modelo (só mantêm ou derrubam o veredito anterior);
# para revisar de novo, só o que mudou, aplica-se o rótulo "revisar-de-novo".
# O nome do job (revisao) vira check obrigatório no M6.

name: Revisão

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

jobs:
  revisao:
    name: revisao
    # Só PRs prontos (rascunhos não podem ser mesclados; ao ficar pronto, o PR é revisado).
    # Os demais eventos (inclusive rótulos alheios) rodam sem chamar o modelo e recalculam o veredito:
    # este check é obrigatório na main, e um job pulado contaria como verde.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Sem cancelar: um push logo depois de "pronto" não pode jogar fora uma revisão já paga.
    # A fila guarda só uma execução pendente; se ela descartar a do rótulo "revisar-de-novo",
    # a execução seguinte encontra o rótulo no PR e faz a revisão pedida. Com "revisão-profunda"
    # não há essa recuperação (o rótulo fica no PR, e reagir a ele a cada push sairia caro):
    # se a revisão profunda não aparecer no comentário, remova e aplique o rótulo de novo.
    concurrency:
      group: revisao-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write # publicar o relatório como comentário no PR
    steps:
      - name: PR de fork
        # Forks não recebem segredos: o revisor não roda e o check fica vermelho, nunca verde por omissão.
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::PR vindo de fork: a revisão automática não roda (sem acesso aos segredos). Revise o diff à mão; para mesclar, traga as mudanças para uma branch deste repositório."
          exit 1
      - name: Código do PR (só para calcular o diff)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Revisor da branch de destino (o PR não altera a própria revisão)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          ref: ${{ github.base_ref }}
          persist-credentials: false
      - name: Escolher a versão do revisor
        id: fonte
        run: |
          if [ -f base/scripts/review/run.ts ]; then
            echo "dir=base" >> "$GITHUB_OUTPUT"
          else
            echo "dir=pr" >> "$GITHUB_OUTPUT"
            echo "::warning::O revisor ainda não existe na branch de destino; usando a versão deste PR (instalação inicial)."
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ steps.fonte.outputs.dir }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ steps.fonte.outputs.dir }}/package-lock.json
      - name: Instalar o revisor
        working-directory: ${{ steps.fonte.outputs.dir }}
        run: npm ci
      - name: Revisar
        working-directory: pr
        env:
          REVIEW_API_KEY: ${{ secrets.REVIEW_API_KEY }}
          REVIEW_DEEP_API_KEY: ${{ secrets.REVIEW_DEEP_API_KEY }}
          REVIEW_API_BASE_URL: ${{ vars.REVIEW_API_BASE_URL }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          REVIEW_SCRIPT: ${{ github.workspace }}/${{ steps.fonte.outputs.dir }}/scripts/review/run.ts
        run: node "$REVIEW_SCRIPT" --mode ci
