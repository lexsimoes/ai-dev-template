# Review canary: every month (and when a PR that changes the reviewer becomes ready), runs the reviewer against fake PRs
# with planted defects (scripts/review/canary/): full review, light tier and incremental review.
# Fails if any defect goes unnoticed or if a finding that was not fixed is marked as resolved.

name: Review canary

on:
  schedule:
    - cron: "17 9 1 * *" # 1st of every month, 09:17 UTC
  workflow_dispatch:
    inputs:
      case:
        description: "Case to run: all, full, light or incremental"
        default: all
  # On PRs, only when the PR becomes ready (or is opened ready); pushes after that do not run the canary.
  pull_request:
    types: [opened, ready_for_review]
    paths:
      - REVIEW.md
      - AGENTS.md
      - scripts/review/**
      - .github/review.json
      - .github/workflows/review*.yml

permissions:
  contents: read

jobs:
  canary:
    name: review-canary (${{ matrix.case }})
    # On PRs: only ready ones (not drafts) and from this repository, like the reviewer.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        case: [full, light, incremental]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # open an issue when the provider's backend for a pinned model changes (pinnedFingerprint)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run the canary
        if: inputs.case == '' || inputs.case == 'all' || inputs.case == matrix.case
        env:
          REVIEW_API_KEY: ${{ secrets.REVIEW_API_KEY }}
          REVIEW_DEEP_API_KEY: ${{ secrets.REVIEW_DEEP_API_KEY }}
          REVIEW_API_BASE_URL: ${{ vars.REVIEW_API_BASE_URL }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          REVIEW_MODEL_VERSION: ${{ vars.REVIEW_MODEL_VERSION }}
          GITHUB_TOKEN: ${{ github.token }}
          CASE: ${{ matrix.case }}
        run: node scripts/review/run.ts --mode canary --canary "$CASE"
