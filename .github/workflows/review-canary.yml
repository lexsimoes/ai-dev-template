# Canário do revisor: todo mês (e em PRs que mudam o revisor), roda o revisor contra PRs fictícios
# com defeitos plantados (scripts/review/canary/): revisão completa, nível leve e revisão incremental.
# Falha se algum defeito passar despercebido ou se um achado não corrigido for dado como resolvido.

name: Canário do revisor

on:
  schedule:
    - cron: "17 9 1 * *" # dia 1 de cada mês, 09:17 UTC
  workflow_dispatch:
    inputs:
      caso:
        description: "Caso a rodar: todos, completa, leve ou incremental"
        default: todos
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - REVIEW.md
      - AGENTS.md
      - scripts/review/**
      - .github/review.json
      - .github/workflows/review*.yml

permissions:
  contents: read

jobs:
  canario:
    name: canario-revisor (${{ matrix.caso }})
    # Em PRs: só prontos (não rascunhos) e deste repositório, como o revisor.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        caso: [completa, leve, incremental]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Rodar o canário
        if: inputs.caso == '' || inputs.caso == 'todos' || inputs.caso == matrix.caso
        env:
          REVIEW_API_KEY: ${{ secrets.REVIEW_API_KEY }}
          REVIEW_DEEP_API_KEY: ${{ secrets.REVIEW_DEEP_API_KEY }}
          REVIEW_API_BASE_URL: ${{ vars.REVIEW_API_BASE_URL }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          CASO: ${{ matrix.caso }}
        run: node scripts/review/run.ts --mode canary --canary "$CASO"
