# Template check (template repository only: excluded from generated projects).
# Renders the Copier template, checks that the .jinja twins match this repository's own files,
# generates two projects with different answers and runs their checks, and tests `copier update`.
# No secrets and no AI calls: costs only Actions minutes.

name: Template

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: template-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  template:
    name: template
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Copier (pinned)
        run: pipx install copier==9.18.2
      - name: Install dependencies
        run: npm ci
      - name: Template tests
        run: npm run test:template
