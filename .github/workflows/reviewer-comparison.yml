# TEMPORARY (never merged): what each DeepSeek alias reports back in a reply (`model`, `system_fingerprint`), twice,
# to design the reviewer's pinned-version check. The comparison runs already finished (previous commit).

name: Reviewer comparison

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  reply-probe:
    name: reply model probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: One tiny call per alias, twice
        env:
          REVIEW_API_KEY: ${{ secrets.REVIEW_API_KEY }}
        run: |
          for model in deepseek-v4-pro deepseek-flash; do
            for i in 1 2; do
              curl -sS https://api.deepseek.com/chat/completions \
                -H "Authorization: Bearer $REVIEW_API_KEY" -H "Content-Type: application/json" \
                -d "{\"model\":\"$model\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with OK.\"}],\"max_tokens\":20,\"reasoning_effort\":\"low\"}" \
                | jq -c --arg asked "$model" '{asked: $asked, model, system_fingerprint}'
            done
          done
